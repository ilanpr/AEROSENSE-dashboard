# No anonymous clients: every device and n8n has its own user and topic ACL.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Actuator commands are small JSON payloads.
message_size_limit 4096
max_queued_messages 20
