limit_req_zone $binary_remote_addr zone=public_api:10m rate=5r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    # Internal worker endpoints must remain on the Docker network.
    location ^~ /api/internal/ { return 404; }
    location /api/ {
        limit_req zone=public_api burst=20 nodelay;
        resolver 127.0.0.11 valid=30s;
        set $backend aerosense-api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(self), microphone=(self)" always;
}
