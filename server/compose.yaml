name: aerosense-backend
services:
  aerosense-api:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks: [n8n]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  # Wibowo TTS, only with: docker compose --profile wibowo up -d --build
  aerosense-tts:
    profiles: [wibowo]
    build: ./tts
    restart: unless-stopped
    environment:
      AEROBOT_LOCAL_TTS_KEY: ${WIBOWO_TTS_KEY:?Set WIBOWO_TTS_KEY in .env}
    networks: [n8n]
    cpus: 1.5
    mem_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  n8n:
    external: true
    name: n8n_default
